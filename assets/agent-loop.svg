<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" fill="none" role="img" aria-labelledby="title description">
  <title id="title">The agent loop — Perceive, reason, act, reflect</title>
  <desc id="description">Four connected steps illustrate an agent loop: take in context, reason about the next step, act with tools, and reflect on the result.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#0C1220"/><stop offset="1" stop-color="#101B2B"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m1 1 5 3-5 3" stroke="#62758E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>.flow{stroke-dasharray:5 7;animation:flow 16s linear infinite}@keyframes flow{to{stroke-dashoffset:-144}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  <rect x=".5" y=".5" width="1199" height="239" rx="14" fill="url(#background)" stroke="#27354C"/>
  <g font-family="Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing="2">
    <text x="32" y="33" fill="#8B9DB7">THE LOOP I’M EXPLORING</text>
    <text x="1168" y="33" text-anchor="end" fill="#60748E" letter-spacing="1">CONTEXT → ACTION → FEEDBACK</text>
  </g>
  <g stroke="#455D73" stroke-width="1.5" marker-end="url(#arrow)">
    <path class="flow" d="M282 117h55"/><path class="flow" d="M562 117h55"/><path class="flow" d="M842 117h55"/>
    <path class="flow" d="M1030 161v38H170v-30" stroke-opacity=".7"/>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="58" y="68" width="224" height="96" rx="10" fill="#101F2B" stroke="#284C55"/>
    <circle cx="88" cy="99" r="10" stroke="#64D9D1" stroke-width="1.5"/><circle cx="88" cy="99" r="3" fill="#64D9D1"/><path d="M88 85v4m0 20v4m-14-14h4m20 0h4" stroke="#64D9D1" stroke-width="1.5"/>
    <text x="111" y="105" fill="#B5EAE4" font-size="18" font-weight="600">Perceive</text>
    <text x="79" y="140" fill="#7F99AE" font-size="12">Take in the context.</text>
    <rect x="338" y="68" width="224" height="96" rx="10" fill="#1C1B30" stroke="#443962"/>
    <path d="m368 88 11 6v12l-11 6-11-6V94Z" stroke="#B69AED" stroke-width="1.5"/><path d="m357 94 11 6 11-6m-11 6v12" stroke="#B69AED" stroke-width="1.5"/>
    <text x="391" y="105" fill="#D0BEF1" font-size="18" font-weight="600">Reason</text>
    <text x="359" y="140" fill="#9591B2" font-size="12">Work out the next step.</text>
    <rect x="618" y="68" width="224" height="96" rx="10" fill="#1D271F" stroke="#3D5436"/>
    <path d="m651 87-11 14h8l-3 12 12-15h-9Z" stroke="#B1E583" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="671" y="105" fill="#C3E5A2" font-size="18" font-weight="600">Act</text>
    <text x="639" y="140" fill="#90A184" font-size="12">Put the tools to work.</text>
    <rect x="898" y="68" width="224" height="96" rx="10" fill="#29221D" stroke="#594533"/>
    <path d="M919 100a10 10 0 1 0 4-8m0-5v7h7" stroke="#E5B887" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="951" y="105" fill="#EDCBA3" font-size="18" font-weight="600">Reflect</text>
    <text x="919" y="140" fill="#A99A88" font-size="12">Learn from the result.</text>
  </g>
  <rect x="496" y="189" width="208" height="20" rx="10" fill="#111C2B"/>
  <text x="600" y="203" text-anchor="middle" font-family="Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing=".7" fill="#7389A3">one iteration at a time</text>
</svg>
