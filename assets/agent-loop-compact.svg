<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" fill="none" role="img" aria-labelledby="title description">
  <title id="title">The agent loop — Perceive, reason, act, reflect</title>
  <desc id="description">A compact, clockwise diagram of an agent loop: perceive context, reason about the next step, act with tools, and reflect on the result.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 5 3-5 3" stroke="#7A91AC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>.flow{stroke-dasharray:4 6;animation:flow 12s linear infinite}@keyframes flow{to{stroke-dashoffset:-120}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
  <rect x=".5" y=".5" width="599" height="389" rx="14" fill="#0E1726" stroke="#27354C"/>
  <text x="30" y="37" font-family="Consolas,monospace" font-size="13" letter-spacing="1.5" fill="#8B9DB7">THE LOOP I’M EXPLORING</text>
  <g class="flow" stroke="#65809B" stroke-width="1.5" marker-end="url(#arrow)"><path d="M264 123h58"/><path d="M442 178v37"/><path d="M336 270h-58"/><path d="M156 218v-28"/></g>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="42" y="70" width="222" height="106" rx="11" fill="#101F2B" stroke="#284C55"/>
    <text x="62" y="113" fill="#B5EAE4" font-size="23" font-weight="600">01 / Perceive</text><text x="62" y="147" fill="#8BA5B9" font-size="15">Take in the context.</text>
    <rect x="336" y="70" width="222" height="106" rx="11" fill="#1C1B30" stroke="#443962"/>
    <text x="356" y="113" fill="#D0BEF1" font-size="23" font-weight="600">02 / Reason</text><text x="356" y="147" fill="#A49BBE" font-size="15">Choose the next step.</text>
    <rect x="336" y="218" width="222" height="106" rx="11" fill="#1D271F" stroke="#3D5436"/>
    <text x="356" y="261" fill="#C3E5A2" font-size="23" font-weight="600">03 / Act</text><text x="356" y="295" fill="#A0AF93" font-size="15">Put the tools to work.</text>
    <rect x="42" y="218" width="222" height="106" rx="11" fill="#29221D" stroke="#594533"/>
    <text x="62" y="261" fill="#EDCBA3" font-size="23" font-weight="600">04 / Reflect</text><text x="62" y="295" fill="#BAAA96" font-size="15">Learn from the result.</text>
  </g>
  <text x="300" y="361" text-anchor="middle" font-family="Consolas,monospace" font-size="12" letter-spacing=".7" fill="#7A90AB">one iteration at a time</text>
</svg>
